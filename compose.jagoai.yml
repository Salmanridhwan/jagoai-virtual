name: jagoai-studio

services:
  openpost:
    image: ghcr.io/getopenpost/openpost:latest
    container_name: jagoai-studio-openpost
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - ./.env.openpost
    environment:
      - OPENPOST_PORT=8080
      - OPENPOST_DATABASE_PATH=/data/db/openpost.db
      - OPENPOST_MEDIA_PATH=/data/media
    volumes:
      - openpost_data:/data

  office:
    build:
      context: .
      dockerfile: deploy/Dockerfile.office
    container_name: jagoai-studio-office
    restart: unless-stopped
    command: python -m app.server --host 0.0.0.0 --port 4500
    depends_on:
      - openpost
    environment:
      - JAGOAI_OPENPOST_URL=http://openpost:8080
    volumes:
      - ./tenant:/app/tenant
      - ./web:/app/web

  pintu:
    image: caddy:2-alpine
    container_name: jagoai-studio-pintu
    restart: unless-stopped
    depends_on:
      - openpost
      - office
    ports:
      - "8088:8088"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  openpost_data:
    name: openpost_openpost_data
    external: true
