[tenant]
slug = "jagoai"
nama = "JagoAI"
paket = "dasar"
mulai = 2026-11-02

[merek]
nama = "JagoAI"
bidang = "kelas membangun website dan aplikasi tanpa coding untuk pemula Indonesia"
kata_kunci = ["website", "web", "coding", "no-code", "nocode", "kelas", "kursus", "pemula", "aplikasi", "ai", "jagoai", "portofolio", "landing"]

[gerbang]
base_url = "https://9router.jagoai.dev/v1"
kunci_env = "JAGOAI_ROUTER_KEY"
batas_harian_tenant = 4200000

[bahan]
cdn_url = "https://cdn.kroombox.com"
cdn_proyek = "jagoai-sosmed"
cdn_kunci_env = "JAGOAI_CDN_API_KEY"
cdn_jwt_env = "JAGOAI_CDN_JWT_TOKEN"

[openpost]
url = "http://localhost:8080"
studio_url = "http://studio.localhost:8088"
kunci_env = "JAGOAI_OPENPOST_TOKEN"
ruang_kerja = ""
media = ""
tiktok = ""
threads = ""
instagram = ""

[kanal]
threads_env = "JAGOAI_THREADS_TOKEN"
instagram_env = "JAGOAI_INSTAGRAM_TOKEN"
tiktok_env = "JAGOAI_TIKTOK_TOKEN"

