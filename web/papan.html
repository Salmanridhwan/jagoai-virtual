<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Papan kerja jagoai-virtual</title>
<style>
  :root { --bg:#14161a; --panel:#1c1f26; --line:#2b303a; --teks:#e6e8ee; --redup:#98a0ad; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--teks);
         font:13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display:flex; gap:14px; align-items:center; padding:10px 16px;
           border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:14px; margin:0; font-weight:600; }
  input { background:#0f1115; color:var(--teks); border:1px solid var(--line);
          border-radius:4px; padding:3px 7px; font:inherit; }
  main { display:flex; gap:14px; padding:16px; align-items:flex-start; }
  section { flex:1; min-width:240px; background:var(--panel); border:1px solid var(--line);
            border-radius:6px; padding:10px; }
  h2 { font-size:12px; margin:0 0 8px; color:var(--redup); font-weight:600;
       text-transform:uppercase; letter-spacing:.6px; }
  .kartu { background:#151920; border:1px solid var(--line); border-radius:5px;
           padding:7px 9px; margin-bottom:7px; cursor:pointer; }
  .kartu:hover { border-color:#4f7cff; }
  .tgl { color:var(--redup); font-size:11px; }
  .topik { margin:2px 0; }
  .meta { color:var(--redup); font-size:11px; }
  .berkas { color:#5aa9f0; font-size:11px; word-break:break-all; }
  footer { padding:0 16px 18px; color:var(--redup); font-size:11px; }
</style>
</head>
<body>
<header>
  <h1>Papan kerja</h1>
  <label>pekan <input id="pekan" size="12" placeholder="YYYY-MM-DD"></label>
  <span id="info" style="color:var(--redup)">memuat…</span>
</header>

<main>
  <section><h2 id="judul-belum">Belum ditulis</h2><div id="belum"></div></section>
  <section><h2>Draf</h2><div id="draf"></div></section>
  <section><h2>Siap</h2><div id="siap"></div></section>
</main>

<footer>
  Kartu hanya muncul dari berkas nyata di <code>tenant/&lt;slug&gt;/keluaran/</code>.
  Slot yang belum punya naskah tinggal di kolom pertama, bukan dianggap selesai.
</footer>

<script>
const el = id => document.getElementById(id);

function kartu(k) {
  const d = document.createElement('div');
  d.className = 'kartu';
  d.innerHTML = `
    <div class="tgl">${k.tanggal}</div>
    <div class="topik">${k.topik}</div>
    <div class="meta">${k.format || ''} ${k.kanal ? '· ' + k.kanal : ''}${k.status ? ' · ' + k.status : ''}</div>
    ${k.berkas ? '<div class="berkas">' + k.berkas + '</div>' : ''}`;
  d.title = k.berkas || 'naskah belum ada';
  return d;
}

function isi(id, daftar) {
  const w = el(id);
  w.innerHTML = '';
  if (!daftar.length) {
    w.innerHTML = '<div class="meta">kosong</div>';
    return;
  }
  daftar.forEach(k => w.appendChild(kartu(k)));
}

async function muat(pekan) {
  const alamat = '/api/papan' + (pekan ? '?pekan=' + encodeURIComponent(pekan) : '');
  try {
    const r = await fetch(alamat, { cache: 'no-store' });
    const d = await r.json();
    if (!pekan) el('pekan').value = d.pekan;
    isi('belum', d.belum || []);
    isi('draf', d.draf || []);
    isi('siap', d.siap || []);
    el('judul-belum').textContent = 'Belum ditulis (' + (d.belum || []).length + ')';
    el('info').textContent = 'pekan ' + d.pekan + ' · ' +
      ((d.belum || []).length + (d.draf || []).length + (d.siap || []).length) + ' slot';
  } catch (e) {
    el('info').textContent = 'gagal membaca papan: ' + e.message;
  }
}

el('pekan').addEventListener('change', e => muat(e.target.value.trim()));
muat('');
</script>
</body>
</html>
